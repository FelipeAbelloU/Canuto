# Configuracion de CANUTO — asistente normativo de la Universidad de los Llanos.
# Modelo fine-tuneado que responde las preguntas.

model:
  # Carpeta del adaptador LoRA que usan el chat y la web. Se llena despues de
  # entrenar, con la carpeta que creo scripts/train_gpu.py (el nombre lo arma
  # solo a partir de los hiperparametros), por ejemplo:
  #   data/checkpoints/t2_7b-e4-lr2e4-r16-wd0.01-do0.05-wu0.1
  # Vacio = no hay modelo cargado. scripts/evaluate.py no lo necesita: recibe la
  # carpeta por --checkpoint, para poder medir varias corridas sin tocar esto.
  checkpoint_path: ""    #IMPORTANTE 
  device: cuda
  # OJO: estos tres NO afectan la evaluacion. evaluate.py fija los suyos por
  # dentro (greedy, 1024 tokens) para que todas las corridas sean comparables
  # aunque aqui se cambien para chatear.
  max_new_tokens: 1024   # el dataset v2 parte las respuestas para que quepan (~900 tokens)
  temperature: 0.3
  top_p: 0.85
  # Instruccion fija que va antes de cada conversacion. ESTE si afecta todo: lo
  # leen train_gpu.py, evaluate.py, el chat y la web. Tiene que ser el mismo
  # texto con el que se entreno la corrida; cambiarlo = entrenar de nuevo.
  # Ademas reemplaza el "You are Qwen, created by Alibaba Cloud..." que Qwen2.5
  # pone solo cuando no hay system prompt.
  system_prompt: >-
    Eres CANUTO, el asistente de normativa de la Universidad de los Llanos (Unillanos).
    Respondes únicamente con base en la normativa de la universidad (acuerdos,
    resoluciones, reglamentos y estatutos), citando siempre el documento y el artículo.
    Si la pregunta no menciona una institución, entiende que se refiere a la
    Universidad de los Llanos. Si no tienes la información o la pregunta no trata
    sobre la normativa, dilo con claridad y no inventes.

# Paso 1: PDFs -> Markdown.
extraction:
  pdf_dir: "PDF"
  raw_dir: "data/raw"            # texto crudo de cada PDF (etapa 1, se hace una vez)
  output_dir: "data/extracted"   # .md limpios (etapa 2, se rehacen desde el crudo)

# Paso 2: Markdown -> pares pregunta/respuesta.
dataset:
  input_dir: "data/extracted"
  output_dir: "data/dataset"

# Chat: cuantos turnos anteriores recuerda la conversacion.
chat:
  max_history: 5
